<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ProxiSpeak</title>
  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', sans-serif;
      background: #0f172a; color: #e2e8f0;
      display: flex; flex-direction: column; height: 100vh; overflow: hidden;
    }

    /* Header */
    header {
      display: flex; align-items: center; gap: 10px;
      padding: 8px 16px; background: #1e293b;
      border-bottom: 1px solid #334155; flex-shrink: 0;
    }
    header h1 { font-size: 16px; font-weight: 700; color: #a5b4fc; }
    .dot { width: 9px; height: 9px; border-radius: 50%; background: #ef4444; transition: background 0.3s; }
    .dot.on { background: #10b981; }
    #status-text { font-size: 12px; color: #64748b; flex: 1; }
    .hbtn {
      padding: 4px 12px; border-radius: 5px; font-size: 12px; cursor: pointer;
      border: 1px solid #334155; background: #1e293b; color: #cbd5e1; transition: all 0.2s;
    }
    .hbtn:hover { background: #334155; }
    .hbtn.active { background: #10b981; border-color: #10b981; color: #fff; }

    /* Join Screen */
    #join-screen {
      display: flex; flex-direction: column; align-items: center;
      justify-content: center; flex: 1; gap: 14px;
    }
    #join-screen h2 { font-size: 24px; font-weight: 700; color: #a5b4fc; }
    #join-screen p  { font-size: 13px; color: #64748b; max-width: 360px; text-align: center; }
    #join-screen input {
      padding: 10px 16px; border-radius: 8px; border: 1px solid #475569;
      background: #1e293b; color: white; font-size: 15px; width: 260px; outline: none;
    }
    #join-screen input:focus { border-color: #4f46e5; }
    #join-screen button {
      padding: 10px 32px; background: #4f46e5; color: white;
      border: none; border-radius: 8px; font-size: 15px; cursor: pointer; transition: background 0.2s;
    }
    #join-screen button:hover { background: #4338ca; }
    #join-screen button:disabled { background: #334155; cursor: not-allowed; }
    #join-msg { font-size: 12px; color: #64748b; min-height: 18px; }

    /* Game Screen */
    #game-screen { display: none; flex: 1; flex-direction: row; overflow: hidden; min-height: 0; }

    /* Canvas */
    #canvas-wrap { flex: 1; position: relative; overflow: hidden; }
    canvas { display: block; cursor: crosshair; }
    #move-hint {
      position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%);
      font-size: 11px; color: #334155; pointer-events: none;
    }
    #prox-banner {
      display: none; position: absolute; top: 10px; left: 50%; transform: translateX(-50%);
      background: #10b981; color: white; padding: 4px 16px;
      border-radius: 999px; font-size: 12px; font-weight: 600; pointer-events: none;
    }

    /* Right Panel */
    #panel {
      width: 240px; background: #1e293b; border-left: 1px solid #334155;
      display: flex; flex-direction: column; flex-shrink: 0; overflow-y: auto;
    }
    .panel-section { padding: 12px; border-bottom: 1px solid #0f172a; }
    .sec-title {
      font-size: 10px; font-weight: 700; color: #475569;
      text-transform: uppercase; letter-spacing: 0.6px; margin-bottom: 8px;
    }

    /* Users list */
    .user-item {
      display: flex; align-items: center; gap: 7px;
      font-size: 12px; padding: 4px 0; border-bottom: 1px solid #0f172a;
    }
    .udot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }
    .uname { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .badge {
      font-size: 9px; padding: 1px 5px; border-radius: 999px;
      font-weight: 700; background: #1e293b; color: #475569;
    }
    .badge.near { background: #022c22; color: #10b981; }
    .badge.rtc  { background: #1e1b4b; color: #818cf8; }

    /* Log */
    #log {
      flex: 1; overflow-y: auto; padding: 8px;
      font-size: 10px; font-family: monospace; background: #0f172a;
    }
    .le { padding: 2px 0; border-bottom: 1px solid #1e293b; color: #64748b; }
    .lg { color: #10b981; }
    .lr { color: #ef4444; }
    .ly { color: #f59e0b; }
  </style>
</head>
<body>

<header>
  <div class="dot" id="conn-dot"></div>
  <h1>🎙️ ProxiSpeak</h1>
  <span id="status-text">Not connected</span>
  <button class="hbtn" id="mic-btn" onclick="toggleMic()">🎤 Mic OFF</button>
</header>

<!-- Join Screen -->
<div id="join-screen">
  <h2>🎙️ ProxiSpeak</h2>
  <p>Move your avatar close to others to automatically start a voice call</p>
  <input id="name-input" type="text" placeholder="Enter your name..." maxlength="20" autofocus />
  <button onclick="joinSpace()">Join Space</button>
  <span id="join-msg"></span>
</div>

<!-- Game Screen -->
<div id="game-screen">
  <div id="canvas-wrap">
    <canvas id="world"></canvas>
    <div id="prox-banner">🔊 In earshot!</div>
    <div id="move-hint">Click to move · Arrow Keys / WASD</div>
  </div>

  <div id="panel">
    <div class="panel-section">
      <div class="sec-title">👥 Users Online</div>
      <div id="user-list"></div>
    </div>
    <div class="panel-section">
      <div class="sec-title">📊 Stats</div>
      <div id="stats" style="font-size:11px;color:#64748b;line-height:1.8;"></div>
    </div>
    <div id="log"></div>
  </div>
</div>

<script>
// ════════════════════════════════════════════════════════════════════════════
//  CONFIG
// ════════════════════════════════════════════════════════════════════════════
const AVATAR_R   = 18;
const MOVE_SPEED = 4;
const THROTTLE   = 50;   // ms between move emissions
const EARSHOT    = 150;  // must match server EARSHOT_PX
const COLORS     = ['#4F46E5','#EF4444','#10B981','#F59E0B','#EC4899','#06B6D4','#8B5CF6','#F97316'];
const ICE_CFG    = { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] };

// ════════════════════════════════════════════════════════════════════════════
//  STATE
// ════════════════════════════════════════════════════════════════════════════
let socket, myId, myColor, myName;
let myX = 450, myY = 300;
let users      = {};
let nearbyIds  = [];
let peerConns  = {};
let localStream = null;
let audioCtx    = null;
let audioPeers  = {};  // peerId → { source, gainNode }
let micEnabled  = false;
let keysDown    = {};
let lastEmit    = 0;

// ════════════════════════════════════════════════════════════════════════════
//  DOM
// ════════════════════════════════════════════════════════════════════════════
const canvas    = document.getElementById('world');
const ctx       = canvas.getContext('2d');
const joinScr   = document.getElementById('join-screen');
const gameScr   = document.getElementById('game-screen');
const nameInput = document.getElementById('name-input');
const connDot   = document.getElementById('conn-dot');
const statusTxt = document.getElementById('status-text');
const proxBanner= document.getElementById('prox-banner');
const micBtn    = document.getElementById('mic-btn');
const joinMsg   = document.getElementById('join-msg');

// ════════════════════════════════════════════════════════════════════════════
//  LOGGING
// ════════════════════════════════════════════════════════════════════════════
function log(msg, cls = '') {
  const el = document.createElement('div');
  el.className = 'le ' + cls;
  el.textContent = `[${new Date().toLocaleTimeString('en',{hour12:false})}] ${msg}`;
  const l = document.getElementById('log');
  l.appendChild(el);
  l.scrollTop = l.scrollHeight;
  while (l.children.length > 100) l.removeChild(l.firstChild);
}

// ════════════════════════════════════════════════════════════════════════════
//  JOIN
// ════════════════════════════════════════════════════════════════════════════
function joinSpace() {
  if (socket && socket.connected) return;
  myName = nameInput.value.trim() || 'Anonymous';

  const joinBtn = document.querySelector('#join-screen button');
  joinBtn.textContent = '🔌 Connecting...';
  joinBtn.disabled = true;
  joinMsg.textContent = 'Connecting to server...';

  if (socket) { socket.disconnect(); socket = null; }

  socket = io(window.location.origin, {
    transports: ['websocket', 'polling'],
    reconnection: true,
    reconnectionAttempts: 5,
    reconnectionDelay: 1000,
    timeout: 10000,
    extraHeaders: { 'ngrok-skip-browser-warning': 'true' }
  });

  socket.on('connect', () => {
    connDot.classList.add('on');
    statusTxt.textContent = `Connected · ${myName}`;
    joinMsg.textContent = '';
    socket.emit('join', { name: myName, x: myX, y: myY });
    joinScr.style.display = 'none';
    gameScr.style.display = 'flex';
    resizeCanvas();
    startLoop();
    log('Connected to ProxiSpeak ✅', 'lg');
  });

  socket.on('disconnect', () => {
    connDot.classList.remove('on');
    statusTxt.textContent = 'Disconnected — retrying...';
    log('Disconnected', 'lr');
  });

  socket.on('connect_error', (err) => {
    connDot.classList.remove('on');
    joinMsg.textContent = `❌ Cannot connect: ${err.message}`;
    log(`Connection error: ${err.message}`, 'lr');
    joinBtn.textContent = 'Join Space';
    joinBtn.disabled = false;
    joinScr.style.display = 'flex';
    gameScr.style.display = 'none';
    socket.disconnect(); socket = null;
  });

  // ── Socket events ──────────────────────────────────────────────────────
  socket.on('self:joined', ({ id, color }) => {
    myId = id; myColor = color;
    log(`Joined as "${myName}"`, 'lg');
  });

  socket.on('users:update', (all) => {
    users = {};
    all.forEach(u => { users[u.id] = u; });
    renderUsers();
    updateStats();
  });

  socket.on('user:moved', ({ id, x, y }) => {
    if (users[id]) { users[id].x = x; users[id].y = y; }
    if (audioPeers[id]) updateGain(id);
  });

  socket.on('user:left', ({ id }) => {
    if (users[id]) log(`${users[id].name} left`, 'ly');
    closePC(id, false);
    delete users[id];
    renderUsers();
    updateStats();
  });

  socket.on('proximity:update', ({ nearbyIds: ids }) => {
    const prev = new Set(nearbyIds);
    const next = new Set(ids);

    // New users in range → start WebRTC
    ids.filter(id => !prev.has(id)).forEach(id => startCall(id));
    // Users left range → hang up
    nearbyIds.filter(id => !next.has(id)).forEach(id => closePC(id, true));

    nearbyIds = ids;
    proxBanner.style.display = ids.length > 0 ? 'block' : 'none';
    renderUsers();
    updateStats();
  });

  // WebRTC signaling
  socket.on('webrtc:offer',         ({ from, offer })     => handleOffer(from, offer));
  socket.on('webrtc:answer',        ({ from, answer })    => handleAnswer(from, answer));
  socket.on('webrtc:ice-candidate', ({ from, candidate }) => handleICE(from, candidate));
  socket.on('webrtc:hangup',        ({ from })            => closePC(from, false));
}

nameInput.addEventListener('keydown', e => { if (e.key === 'Enter') joinSpace(); e.stopPropagation(); });

// ════════════════════════════════════════════════════════════════════════════
//  CANVAS + RENDER LOOP
// ════════════════════════════════════════════════════════════════════════════
function resizeCanvas() {
  const wrap = document.getElementById('canvas-wrap');
  canvas.width  = wrap.clientWidth;
  canvas.height = wrap.clientHeight;
}
window.addEventListener('resize', resizeCanvas);

function startLoop() { requestAnimationFrame(loop); }

function loop() {
  handleKeys();
  draw();
  requestAnimationFrame(loop);
}

function draw() {
  const w = canvas.width, h = canvas.height;
  ctx.clearRect(0, 0, w, h);

  // Grid
  ctx.strokeStyle = '#1e293b'; ctx.lineWidth = 1;
  for (let x = 0; x <= w; x += 40) { ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,h); ctx.stroke(); }
  for (let y = 0; y <= h; y += 40) { ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(w,y); ctx.stroke(); }

  // Earshot circle
  if (myId) {
    ctx.beginPath(); ctx.arc(myX, myY, EARSHOT, 0, Math.PI*2);
    ctx.strokeStyle = 'rgba(79,70,229,0.3)'; ctx.lineWidth = 1.5;
    ctx.setLineDash([5,5]); ctx.stroke(); ctx.setLineDash([]);
    ctx.fillStyle = 'rgba(79,70,229,0.05)'; ctx.fill();
  }

  // Connection lines
  nearbyIds.forEach(id => {
    const u = users[id]; if (!u) return;
    const dist = Math.sqrt((u.x-myX)**2 + (u.y-myY)**2);
    const alpha = Math.max(0, 1 - dist / EARSHOT);
    ctx.beginPath(); ctx.moveTo(myX, myY); ctx.lineTo(u.x, u.y);
    ctx.strokeStyle = `rgba(99,102,241,${alpha.toFixed(2)})`;
    ctx.lineWidth = 2; ctx.stroke();
  });

  // Avatars
  Object.values(users).forEach(u => drawAvatar(u));
}

function drawAvatar(u) {
  const isMe     = u.id === myId;
  const isNearby = nearbyIds.includes(u.id);
  const isRTC    = !!peerConns[u.id];
  const c        = u.color || '#4F46E5';

  if (isRTC)    { ctx.beginPath(); ctx.arc(u.x,u.y,AVATAR_R+8,0,Math.PI*2); ctx.fillStyle='rgba(99,102,241,0.15)'; ctx.fill(); }
  else if (isNearby){ ctx.beginPath(); ctx.arc(u.x,u.y,AVATAR_R+5,0,Math.PI*2); ctx.fillStyle='rgba(16,185,129,0.12)'; ctx.fill(); }

  ctx.beginPath(); ctx.arc(u.x,u.y,AVATAR_R,0,Math.PI*2); ctx.fillStyle=c; ctx.fill();
  if (isMe) { ctx.beginPath(); ctx.arc(u.x,u.y,AVATAR_R+3,0,Math.PI*2); ctx.strokeStyle='white'; ctx.lineWidth=2; ctx.stroke(); }

  ctx.fillStyle='white'; ctx.font=`bold ${AVATAR_R}px Segoe UI`;
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText((u.name||'?')[0].toUpperCase(), u.x, u.y);
  ctx.fillStyle=isMe?'white':'#94a3b8';
  ctx.font=isMe?'bold 11px Segoe UI':'11px Segoe UI';
  ctx.textAlign='center'; ctx.textBaseline='top';
  ctx.fillText(u.name+(isMe?' (you)':''), u.x, u.y+AVATAR_R+4);
}

// ════════════════════════════════════════════════════════════════════════════
//  MOVEMENT
// ════════════════════════════════════════════════════════════════════════════
canvas.addEventListener('click', e => {
  const r = canvas.getBoundingClientRect();
  moveTo(e.clientX - r.left, e.clientY - r.top);
});

document.addEventListener('keydown', e => { keysDown[e.key] = true; });
document.addEventListener('keyup',   e => { keysDown[e.key] = false; });

function handleKeys() {
  if (!myId) return;
  let dx = 0, dy = 0;
  if (keysDown['ArrowLeft']  || keysDown['a'] || keysDown['A']) dx -= MOVE_SPEED;
  if (keysDown['ArrowRight'] || keysDown['d'] || keysDown['D']) dx += MOVE_SPEED;
  if (keysDown['ArrowUp']    || keysDown['w'] || keysDown['W']) dy -= MOVE_SPEED;
  if (keysDown['ArrowDown']  || keysDown['s'] || keysDown['S']) dy += MOVE_SPEED;
  if (dx !== 0 || dy !== 0) {
    myX = Math.max(AVATAR_R, Math.min(canvas.width  - AVATAR_R, myX + dx));
    myY = Math.max(AVATAR_R, Math.min(canvas.height - AVATAR_R, myY + dy));
    emitMove();
  }
}

function moveTo(x, y) {
  myX = Math.max(AVATAR_R, Math.min(canvas.width  - AVATAR_R, x));
  myY = Math.max(AVATAR_R, Math.min(canvas.height - AVATAR_R, y));
  emitMove();
}

function emitMove() {
  const now = Date.now();
  if (!socket || !myId || now - lastEmit < THROTTLE) return;
  lastEmit = now;
  socket.emit('move', { x: myX, y: myY });
  if (users[myId]) { users[myId].x = myX; users[myId].y = myY; }
}

// ════════════════════════════════════════════════════════════════════════════
//  MICROPHONE
// ════════════════════════════════════════════════════════════════════════════
async function toggleMic() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === 'suspended') await audioCtx.resume();

  if (!micEnabled) {
    try {
      localStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
      micEnabled = true;
      micBtn.textContent = '🎤 Mic ON';
      micBtn.classList.add('active');
      log('Microphone enabled', 'lg');
      // Reconnect any existing peers with the new stream
      Object.keys(peerConns).forEach(id => closePC(id, true));
      nearbyIds.forEach(id => startCall(id));
    } catch (e) {
      log(`Mic error: ${e.message}`, 'lr');
    }
  } else {
    localStream?.getTracks().forEach(t => t.stop());
    localStream = null;
    micEnabled = false;
    micBtn.textContent = '🎤 Mic OFF';
    micBtn.classList.remove('active');
    log('Microphone disabled', 'ly');
  }
}

// ════════════════════════════════════════════════════════════════════════════
//  WebRTC
// ════════════════════════════════════════════════════════════════════════════
function startCall(peerId) {
  if (peerConns[peerId] || myId > peerId) return; // only initiator creates offer
  const pc = createPC(peerId);
  if (localStream) localStream.getTracks().forEach(t => pc.addTrack(t, localStream));
  pc.createOffer()
    .then(offer => pc.setLocalDescription(offer))
    .then(() => socket.emit('webrtc:offer', { targetId: peerId, offer: pc.localDescription }))
    .catch(e => log(`Offer error: ${e.message}`, 'lr'));
}

async function handleOffer(from, offer) {
  const pc = createPC(from);
  if (localStream) localStream.getTracks().forEach(t => pc.addTrack(t, localStream));
  await pc.setRemoteDescription(new RTCSessionDescription(offer));
  const answer = await pc.createAnswer();
  await pc.setLocalDescription(answer);
  socket.emit('webrtc:answer', { targetId: from, answer: pc.localDescription });
}

async function handleAnswer(from, answer) {
  const pc = peerConns[from];
  if (pc) await pc.setRemoteDescription(new RTCSessionDescription(answer));
}

async function handleICE(from, candidate) {
  const pc = peerConns[from];
  if (pc) await pc.addIceCandidate(new RTCIceCandidate(candidate)).catch(() => {});
}

function createPC(peerId) {
  const pc = new RTCPeerConnection(ICE_CFG);
  peerConns[peerId] = pc;

  pc.onicecandidate = e => {
    if (e.candidate) socket.emit('webrtc:ice-candidate', { targetId: peerId, candidate: e.candidate });
  };

  pc.ontrack = e => {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const stream = e.streams[0];
    const source = audioCtx.createMediaStreamSource(stream);
    const gain   = audioCtx.createGain();
    source.connect(gain); gain.connect(audioCtx.destination);
    audioPeers[peerId] = { source, gain };
    updateGain(peerId);
    log(`🔊 Audio from ${users[peerId]?.name || peerId.slice(0,8)}`, 'lg');
  };

  pc.onconnectionstatechange = () => {
    if (['failed','disconnected','closed'].includes(pc.connectionState)) closePC(peerId, false);
  };

  return pc;
}

function closePC(peerId, sendHangup) {
  const pc = peerConns[peerId];
  if (!pc) return;
  pc.close();
  delete peerConns[peerId];
  if (audioPeers[peerId]) {
    audioPeers[peerId].source?.disconnect();
    audioPeers[peerId].gain?.disconnect();
    delete audioPeers[peerId];
  }
  if (sendHangup && socket) socket.emit('webrtc:hangup', { targetId: peerId });
}

// Volume fades linearly with distance (0 at edge, 1 at center)
function updateGain(peerId) {
  const peer = audioPeers[peerId];
  const u    = users[peerId];
  if (!peer || !u) return;
  const dist  = Math.sqrt((u.x - myX)**2 + (u.y - myY)**2);
  const gain  = Math.max(0, 1 - dist / EARSHOT);
  peer.gain.gain.setTargetAtTime(gain, audioCtx.currentTime, 0.05);
}

// ════════════════════════════════════════════════════════════════════════════
//  SIDEBAR UI
// ════════════════════════════════════════════════════════════════════════════
function renderUsers() {
  const ul = document.getElementById('user-list');
  ul.innerHTML = '';
  Object.values(users).forEach(u => {
    const isMe   = u.id === myId;
    const isNear = nearbyIds.includes(u.id);
    const isRTC  = !!peerConns[u.id];
    const div    = document.createElement('div');
    div.className = 'user-item';
    div.innerHTML = `
      <div class="udot" style="background:${u.color||'#4F46E5'}"></div>
      <span class="uname">${u.name}${isMe?' (you)':''}</span>
      ${isRTC  ? '<span class="badge rtc">🔊 RTC</span>'  : ''}
      ${isNear && !isRTC ? '<span class="badge near">📡</span>' : ''}`;
    ul.appendChild(div);
  });
}

function updateStats() {
  const total = Object.keys(users).length;
  const rtc   = Object.keys(peerConns).length;
  document.getElementById('stats').innerHTML = `
    Users online: <b>${total}</b><br>
    Nearby: <b>${nearbyIds.length}</b><br>
    Active calls: <b>${rtc}</b><br>
    Earshot radius: <b>${EARSHOT}px</b>`;
}
</script>
</body>
</html>
